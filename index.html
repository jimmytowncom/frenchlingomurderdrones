function vocabQs(ws){return rnd(ws.map(w=>{const fr2en=Math.random()<.6,i=fr2en?1:0,o=rnd(V.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[i]);
 return{t:"mc",p:fr2en?w[0]:w[1],say:fr2en?w[0]:null,ask:fr2en?"What does this mean?":"How do you say this in French?",a:w[i],o:rnd([w[i],...o]),n:fr2en?"":w[0]};}));}
let st={td:0,dd:"",done:{},xp:0,streak:0,day:""};
try{st=Object.assign(st,JSON.parse(localStorage.getItem("drones_fr2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("drones_fr2",JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s),app=$("#app");
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let G;
function head(){const pct=G.ok/G.n*100;return`<div class="qhead"><button class="x" id="quit">✕</button><div class="bar"><i style="width:${pct}%"></i></div><b>❤️ ${G.hp}</b></div>`}
function step(){if(G.k>=G.q.length)return finish();const q=G.q[G.k];G.pick=null;G.built=[];if(q.t=="blitz")return blitz(q);if(q.t=="read")return readG(q);if(q.t=="match")return matchG(q);
 app.innerHTML=head()+`<div class="q"><h2>${q.ask}</h2>`+(q.t=="mc"?`<div class="big">${q.hide?"":q.p}${q.say?`<button class="spk" id="spk">🔊</button>`:""}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>`
 :`<div class="big" style="font-size:22px">“${q.p}”</div><div class="tray" id="tray"></div><div class="bank">${q.toks.map((t,j)=>`<button class="tok" data-j="${j}">${t}</button>`).join("")}</div>`)+`</div><div id="foot"><button class="btn" id="chk" disabled>Check</button></div>`;
 $("#quit").onclick=home;if(q.say)$("#spk").onclick=()=>speak(q.say);if(q.hide)speak(q.say);
 if(q.t=="mc")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");G.pick=q.o[+b.dataset.j];$("#chk").disabled=false});
 else app.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(G.built.includes(j))G.built=G.built.filter(x=>x!=j);else G.built.push(j);drawBank(q)});
 $("#chk").onclick=()=>check(q);}
function drawBank(q){$("#tray").innerHTML=G.built.map(j=>`<button class="tok" data-j="${j}">${q.toks[j]}</button>`).join("");
 $("#tray").querySelectorAll(".tok").forEach(b=>b.onclick=()=>{G.built=G.built.filter(x=>x!=+b.dataset.j);drawBank(q)});
 app.querySelectorAll(".bank .tok").forEach(b=>b.classList.toggle("used",G.built.includes(+b.dataset.j)));$("#chk").disabled=!G.built.length;}
function check(q){const ans=q.t=="mc"?G.pick:G.built.map(j=>q.toks[j]).join(" ");const good=ans===q.a;
 app.querySelectorAll(".opt,.tok").forEach(b=>b.disabled=true);
 if(good){G.ok++;addXp(10)}else{G.hp--;G.q.push(q)}
 if(q.t=="bank"||q.say)speak(q.t=="bank"?q.a:q.p);
 $("#foot").innerHTML=`<div class="foot ${good?"ok":"bad"}"><p><b>${good?"Parfait ! ✨":"Not quite"}</b>${good?"":`<br>Answer: ${q.a}`}${q.n?`<br><small>${q.n}</small>`:""}</p><button class="btn" id="nx">Continue</button></div>`;
 $("#nx").onclick=()=>{G.k++;if(G.hp<=0)return fail();step()};$("#nx").focus();}
function fail(){app.innerHTML=`<div class="end"><div class="em">💥</div><h1>Out of hearts</h1><p class="sub">Even drones need a reboot. Try again!</p><button class="btn" id="r">Retry</button><p><button class="x" id="h">Back to path</button></p></div>`;$("#r").onclick=()=>start(G.i,G.mk);$("#h").onclick=home}
const UN=[],FL=[],CO=["#7a3cff","#d6334b","#1a9a58","#e07b00","#0a82c8","#c4287c"];
const lst=ch=>rnd(ch).slice(0,6).map(l=>({t:"mc",hide:1,say:l[0],ask:"Tap 🔊 and pick the meaning",a:l[1],o:rnd([l[1],...rnd(ch.filter(x=>x[1]!==l[1])).slice(0,3).map(x=>x[1])]),n:l[0]}));
const clz=ch=>rnd(ch).slice(0,8).flatMap(l=>{const p=l[0].split(/([\p{L}]+)/u),ix=p.map((w,i)=>i%2&&w.length>2&&WS.has(w.toLowerCase())?i:-1).filter(i=>i>=0);if(!ix.length)return[];const i=rnd(ix)[0],a=p[i].toLowerCase();p[i]="_____";
 return[{t:"mc",ask:"Fill in the blank",p:`<span>${p.join("")}<br><small style="font-weight:400;color:var(--mute)">${l[1]}</small></span>`,a,o:rnd([a,...rnd([...WS].filter(x=>x!==a&&x.length>2)).slice(0,3)]),n:l[0]}]});
{const n=Math.ceil(V.length/15),z=Math.ceil(V.length/n);for(let k=0;k<n;k++){const P=V.slice(k*z,k*z+z),o=k*z;
 UN.push({n:`Words ${o+1}–${o+P.length}`,c:CO[k%6],L:[["Learn","📖",()=>vocabQs(P)],["Listen","🎧",()=>rnd(P.slice(0,8)).map(w=>({t:"mc",hide:1,say:w[0],ask:"Tap 🔊 to listen. What did you hear?",a:w[1],o:rnd([w[1],...rnd(V.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1])]),n:w[0]}))],["Match","🧩",()=>[0,5,10].filter(i=>P[i]).map(i=>({t:"match",P:P.slice(i,i+5)}))],["Speed Blitz","⚡",()=>[{t:"blitz",P}]]]})}}
EP.forEach((ch,k)=>UN.push({ep:1,n:`Scene ${k+1} · ${mmss(ch[0][2])}–${mmss(ch[ch.length-1][2])}`,c:CO[k%6],L:[["Read","📜",()=>[{t:"read",lines:ch}]],["Fill-in","✏️",()=>clz(ch)],["Listen","🎧",()=>lst(ch)]]}));
UN.forEach(u=>u.L.forEach(l=>{l.i=FL.length;FL.push({mk:l[2]})}));

const fixDay=()=>{const d=new Date().toDateString();if(st.dd!==d){st.dd=d;st.td=0}};
function addXp(n){fixDay();st.xp+=n;st.td+=n;if(G)G.gain=(G.gain||0)+n}
function start(i,mk){G={i,mk,q:mk(),k:0,hp:3,ok:0,gain:0};G.n=G.q.length;step()}
function home(){fixDay();let c=0;const tab=+(st.tab||0),my=UN.filter(u=>!!u.ep==!!tab),ls=my.flatMap(u=>u.L),nx=ls.find(l=>!st.done[l.i]),dn=ls.filter(l=>st.done[l.i]).length;
 app.innerHTML=`<h1>🤖 Drones Français</h1><div class="top"><div class="pill">⭐ ${st.xp} XP</div><div class="pill">🔥 ${st.streak}</div><div class="pill">🎯 ${Math.min(st.td,50)}/50</div></div><div class="top"><button class="pill tb" data-t="0" style="border-color:${tab?"var(--line)":"var(--acc)"}">📚 Words</button><button class="pill tb" data-t="1" style="border-color:${tab?"var(--acc)":"var(--line)"}">🎬 Episode 1</button></div><p class="sub">${tab?"Scene by scene, until you understand every line.":"Every word in the episode, most common first."} ${dn}/${ls.length} lessons done.</p><button class="btn" id="prac">🎲 Random practice</button>`+
 my.map(u=>`<div class="unit" style="background:${u.c}"><b>${u.n}</b></div><div class="nodes">`+u.L.map(l=>{const d=st.done[l.i],lock=nx&&l.i>nx.i,j=c++;
  return`<div class="nw" style="transform:translateX(${[0,46,0,-46,0][j%5]}px)"><button class="node ${nx&&l.i==nx.i?"cur":""}" style="background:${d?"var(--ok)":u.c}" data-i="${l.i}" ${lock?"disabled":""}>${d?"✓":lock?"🔒":l[1]}</button><small>${l[0]}</small></div>`}).join("")+`</div>`).join("");
 app.querySelectorAll(".node").forEach(b=>b.onclick=()=>start(+b.dataset.i,FL[+b.dataset.i].mk));
 app.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{st.tab=+b.dataset.t;save();home()});
 $("#prac").onclick=()=>start(-1,()=>rnd([...vocabQs(rnd(V).slice(0,6)),...clz(rnd(EP.flat()).slice(0,10))]).slice(0,12));}
function readG(q){app.innerHTML=head()+`<div class="q"><h2>Read it. Tap any word for its meaning.</h2><div id="tip" class="foot ok" style="margin:0 0 14px"><b>👆 Tap a word</b></div>`+q.lines.map((l,i)=>`<div class="ln"><div class="fr">${l[0].replace(/[\p{L}]+/gu,w=>`<span class="w">${w}</span>`)} <button class="spk" data-i="${i}">🔊</button></div><div class="en">${l[1]}</div></div>`).join("")+`</div><div id="foot"><button class="btn" id="nx">I understand it</button></div>`;$("#quit").onclick=home;
 app.querySelectorAll(".w").forEach(e=>e.onclick=()=>{const w=e.textContent.toLowerCase();$("#tip").innerHTML=`<b>${e.textContent}</b> = ${WM[w]||"see the line meaning below it"}`});
 app.querySelectorAll(".spk").forEach(b=>b.onclick=()=>speak(q.lines[+b.dataset.i][0]));$("#nx").onclick=()=>{G.ok++;addXp(10);G.k++;step()}}
function cont(m,ok=1){$("#foot").innerHTML=`<div class="foot ${ok?"ok":"bad"}"><p><b>${m}</b></p><button class="btn" id="nx">Continue</button></div>`;$("#nx").onclick=()=>{G.k++;step()};$("#nx").focus()}
function matchG(q){const P=q.P;let sel=null,left=P.length;const bt=(p,j,s)=>`<button class="opt" data-s="${s}" data-i="${j}">${p}</button>`;
 app.innerHTML=head()+`<div class="q"><h2>Tap the matching pairs</h2><div class="mt"><div>${rnd(P.map((w,j)=>bt(w[0],j,"l"))).join("")}</div><div>${rnd(P.map((w,j)=>bt(w[1],j,"r"))).join("")}</div></div></div><div id="foot"></div>`;$("#quit").onclick=home;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(sel&&sel.dataset.s==b.dataset.s){sel.classList.remove("sel");sel=null}
  if(!sel){sel=b;b.classList.add("sel");if(b.dataset.s=="l")speak(P[+b.dataset.i][0]);return}
  if(sel.dataset.i==b.dataset.i){[sel,b].forEach(x=>x.classList.add("gone"));sel=null;if(!--left){G.ok++;addXp(10);cont("Parfait ! ✨")}}
  else{sel.classList.remove("sel");sel=null;G.hp--;$(".qhead b").textContent="❤️ "+G.hp;if(G.hp<=0)fail()}});}
function blitz(q){const P=q.P;let t=45,sc=0;
 app.innerHTML=`<div class="qhead"><button class="x" id="quit">✕</button><b id="bt">⏱ 45</b><b>⚡ <span id="bs">0</span></b></div><div class="q"><h2>Speed Blitz: get 6 right in 45 seconds!</h2><div id="bq"></div></div>`;$("#quit").onclick=home;
 const T=setInterval(()=>{if(!$("#bt"))return clearInterval(T);$("#bt").textContent="⏱ "+--t;if(t<=0){clearInterval(T);end()}},1000);
 function end(){const win=sc>=6;if(win){G.ok=1;addXp(sc*2)}app.innerHTML=`<div class="end"><div class="em">${win?"⚡":"💥"}</div><h1>${sc} correct!</h1><p class="sub">${win?"Lightning reflexes.":"You need 6 to pass. Go again!"}</p><button class="btn" id="nx">${win?"Continue":"Retry"}</button></div>`;$("#nx").onclick=()=>win?(G.k++,step()):start(G.i,G.mk)}
 (function ask(){const a=P[Math.random()*P.length|0],o=rnd([a,...rnd(P.filter(x=>x[1]!==a[1])).slice(0,3)]);
  $("#bq").innerHTML=`<div class="big">${a[0]}<button class="spk" id="sp">🔊</button></div><div class="opts">${o.map(x=>`<button class="opt">${x[1]}</button>`).join("")}</div>`;$("#sp").onclick=()=>speak(a[0]);
  document.querySelectorAll("#bq .opt").forEach((b,j)=>b.onclick=()=>{if(t<=0)return;if(o[j]===a){sc++;$("#bs").textContent=sc}ask()})})();}

 if(st.day!==d){st.streak=(st.day===new Date(Date.now()-864e5).toDateString())?st.streak+1:1;st.day=d}save();
